<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' live2d: data:; style-src 'self' 'unsafe-inline'; script-src 'self';"><title>Live2D Desktop Assistant · 控制面板</title><link rel="stylesheet" href="./settings.css"></head>
<body><div class="panel-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">L</span><div>Live2D<small>DESKTOP ASSISTANT</small></div></div><div class="sidebar-caption">控制中心</div><nav id="navigation"></nav><div class="sidebar-bottom"><span class="online-dot"></span> 本地运行<span class="version">1.0.3</span><button id="quit" class="quiet">退出助手</button></div></aside>
<div class="workspace"><header class="titlebar"><div><strong id="pageTitle">模型</strong><span id="pageSubtitle">为桌面选择一位伙伴</span></div><div class="title-actions"><button id="showPet">显示桌宠</button><button id="closePanel" aria-label="关闭控制面板">×</button></div></header>
<div class="toolbar"><button id="refresh" title="重新读取模型库">↻ 刷新</button><button id="random">随机</button><button id="clear">清除选择</button><form id="searchForm"><input id="search" placeholder="搜索模型名称或动作" aria-label="搜索"><button type="submit">搜索</button></form><select id="filter" aria-label="筛选模型"><option value="all">全部类型</option><option value="live2d">Live2D</option><option value="image">静态图片</option></select><button id="library">模型库管理</button></div>
<div id="notice" role="status" aria-live="polite">准备就绪</div><main id="content"></main><footer class="panel-footer"><span>模型与设置保存在本机</span><span id="libraryCount">0 个模型</span></footer></div></div>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="button-row"><button id="cancelConfirm">取消</button><button id="acceptConfirm" class="primary">确认</button></div></dialog>
<script src="./action-catalog.js"></script><script src="./control-panel.js"></script><script src="./settings.js"></script></body></html>
